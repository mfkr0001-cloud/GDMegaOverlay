name: Build GDMegaOverlay Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android ARM64 (.geode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build with current stable Geode SDK
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release

      - name: Upload Android64 package
        uses: actions/upload-artifact@v4
        with:
          name: GDMegaOverlay-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft Android prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download Android64 package
        uses: actions/download-artifact@v4
        with:
          name: GDMegaOverlay-Android64
          path: dist

      - name: Verify package archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.geode)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .geode package was produced" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            unzip -t "$package"
            ls -lh "$package"
          done

      - name: Create GitHub draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: GDMegaOverlay Android ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: dist/*.geode
